<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>drive deodorant</title>
    <link rel="icon" type="image/png" href="Photos/Jamper.png">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; }
        canvas { display: none; background: #000; } 
        
        #error-screen { position: absolute; width: 100%; height: 100%; background: #000; color: #ff4444; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 40px; z-index: 10000; border: 10px solid #ff4444; box-sizing: border-box; }

        /* ===== V1.2 TITLE SCREEN ===== */
        #loading-screen {
            position: absolute; width: 100%; height: 100%; z-index: 500; overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between;
            background: linear-gradient(180deg, #7ec8f2 0%, #bfe4fb 22%, #c9614a 22%, #c9614a 88%, #b7b7ad 88%, #b7b7ad 100%);
        }
        #loading-screen::before {
            /* clouds */
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 24%; pointer-events: none;
            background:
                radial-gradient(60px 26px at 12% 55%, rgba(255,255,255,0.95), transparent 70%),
                radial-gradient(45px 20px at 20% 40%, rgba(255,255,255,0.9), transparent 70%),
                radial-gradient(70px 30px at 68% 60%, rgba(255,255,255,0.9), transparent 70%),
                radial-gradient(50px 22px at 78% 35%, rgba(255,255,255,0.9), transparent 70%),
                radial-gradient(55px 24px at 90% 65%, rgba(255,255,255,0.85), transparent 70%);
        }
        #loading-screen::after {
            /* brick wall texture */
            content: ""; position: absolute; top: 22%; left: 0; width: 100%; height: 66%; pointer-events: none;
            background-color: #c9614a;
            background-image:
                linear-gradient(rgba(0,0,0,0.18) 3px, transparent 3px),
                linear-gradient(90deg, rgba(0,0,0,0.18) 3px, transparent 3px),
                linear-gradient(90deg, rgba(0,0,0,0.18) 3px, transparent 3px);
            background-size: 90px 40px, 90px 40px, 90px 40px;
            background-position: 0 0, 0 0, 45px 20px;
        }
        .title-row { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: flex-start; padding: 30px 40px 0; }
        .bubble-text { font-family: 'Arial Black', 'Arial Bold', Gadget, sans-serif; font-weight: 900; line-height: 0.9; -webkit-text-stroke: 7px #000; paint-order: stroke fill; text-shadow: 6px 6px 0 rgba(0,0,0,0.35); }
        .title-main { font-size: clamp(48px, 8vw, 100px); background: linear-gradient(180deg, #fff3a0, #ffb703); -webkit-background-clip: text; background-clip: text; color: #ffb703; }
        .title-sub { font-size: clamp(20px, 3vw, 34px); background: linear-gradient(180deg, #fff3a0, #ffb703); -webkit-background-clip: text; background-clip: text; color: #ffb703; margin-left: 6px; align-self: flex-start; margin-top: 8px; }
        .title-left { display: flex; align-items: flex-start; }
        .version-badge { font-size: clamp(22px, 3.2vw, 40px); text-align: right; -webkit-text-stroke: 5px #000; background: linear-gradient(180deg, #fff3a0, #ffb703); -webkit-background-clip: text; background-clip: text; color: #ffb703; }

        #bottleFrame { position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%) rotate(-12deg); z-index: 2; width: 160px; height: 160px; background: linear-gradient(135deg, #cfcfcf, #8f8f8f); border: 6px solid #fff; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #bottleFrame img { width: 70%; height: auto; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }

        .menu-buttons { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 18px; padding-bottom: 70px; }
        .title-btn { font-family: 'Arial Black', 'Arial Bold', Gadget, sans-serif; font-weight: 900; font-size: clamp(22px, 3vw, 34px); color: #fff; -webkit-text-stroke: 2px #000; paint-order: stroke fill; padding: 14px 60px; border-radius: 14px; border: 5px solid #fff; box-shadow: 0 6px 0 rgba(0,0,0,0.35), inset 0 3px 0 rgba(255,255,255,0.35); cursor: pointer; text-transform: uppercase; transition: transform 0.1s; }
        .title-btn:hover { transform: translateY(-3px); }
        .title-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.35); }
        #startBtn { background: linear-gradient(180deg, #ff5a4e, #d81e1e); }
        #webBtn { background: linear-gradient(180deg, #8fe26a, #4caf22); text-decoration: none; display: inline-block; }
        
        #pause-overlay { position: absolute; width: 100%; height: 100%; background: rgba(0, 5, 0, 0.98); display: none; justify-content: center; align-items: center; z-index: 1000; gap: 20px; }
        .menu-sidebar { display: flex; flex-direction: column; gap: 10px; width: 200px; }
        .menu-btn { background: #111; border: 2px solid #00ff66; color: #00ff66; padding: 12px; font-size: 14px; font-weight: bold; text-align: left; cursor: pointer; text-transform: uppercase; }
        
        .content-panel { width: 550px; height: 500px; border: 2px solid #00ff66; background: #000; display: flex; flex-direction: column; position: relative; }
        .panel-header { background: #00ff66; color: #000; padding: 8px; font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; }
        
        /* JUKEBOX */
        .jukebox { padding: 20px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex-grow: 1; }
        .track-btn { background: #001100; border: 1px solid #008844; color: #00ff66; padding: 15px; cursor: pointer; text-align: left; display: flex; flex-direction: column; transition: 0.2s; border-left: 5px solid #00ff66; }
        .track-btn:hover { background: #00ff66; color: #000; transform: translateX(5px); }
        .track-title { font-weight: bold; font-size: 14px; margin-bottom: 2px; }
        .track-file { font-size: 10px; opacity: 0.7; }

        /* MEDIA BAR REFERENCE */
        .media-controls { display: flex; justify-content: center; align-items: center; gap: 20px; padding: 20px; border-top: 1px solid #00ff66; background: #000a00; }
        .control-icon-btn { background: none; border: none; color: #00ff66; font-size: 24px; cursor: pointer; opacity: 0.5; transition: 0.2s; }
        .control-icon-btn:hover { opacity: 1; transform: scale(1.1); }
        .play-pause-circle { font-size: 42px; opacity: 1; }

        #countdown-text { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: #00ff66; font-size: 120px; font-weight: bold; display: none; z-index: 2000; text-shadow: 0 0 20px #00ff66; }
        #retryBtn { display:none; position:absolute; top:60%; left:50%; transform:translate(-50%,-50%); padding:20px 40px; background:#00ff66; font-weight:bold; cursor:pointer; z-index: 600; border:none; color: #000; font-size: 20px; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="error-screen"><h1>⚠️ FILE ERROR ⚠️</h1><p id="error-msg"></p></div>
    <div id="loading-screen">
        <div class="title-row">
            <div class="title-left">
                <span class="bubble-text title-main">DRIVE</span>
                <span class="bubble-text title-sub">DEO</span>
            </div>
            <div class="bubble-text version-badge">V1.2<br>IS HERE</div>
        </div>

        <div id="bottleFrame"><img src="Photos/bottle.png" alt="deodorant"></div>

        <div class="menu-buttons">
            <button id="startBtn" class="title-btn">PLAY</button>
            <a id="webBtn" class="title-btn" href="https://sites.google.com/view/drivedeo/home" target="_blank" rel="noopener">OFFICAL WEB</a>
        </div>
    </div>
    <div id="countdown-text">3</div>

    <div id="pause-overlay">
        <div class="menu-sidebar">
            <button class="menu-btn" onclick="togglePause()">Continue</button>
            <button class="menu-btn" onclick="location.reload()">Restart</button>
            <button class="menu-btn" onclick="document.getElementById('file-input').click()">Import MP3</button>
            <input type="file" id="file-input" accept="audio/*" style="display:none">
        </div>
        
        <div class="content-panel">
            <div class="panel-header"><span>SYSTEM_JUKEBOX</span><span id="copy-tag" onclick="showInspo()" style="cursor:pointer">© 2026 IZAYYAH_DEV</span></div>
            <div class="jukebox" id="track-list">
                <button class="track-btn" onclick="playTrack('Audio/BikeRides.mp3')"><span class="track-title">Bike Rides</span><span class="track-file">BikeRides.mp3</span></button>
                <button class="track-btn" onclick="playTrack('Audio/TidalWave.mp3')"><span class="track-title">Tidal Wave</span><span class="track-file">TidalWave.mp3</span></button>
                <button class="track-btn" onclick="playTrack('Audio/JumperBeat.mp3')"><span class="track-title">Jumper Beat</span><span class="track-file">JumperBeat.mp3</span></button>
                <button class="track-btn" onclick="playTrack('Audio/Chicken.mp3')"><span class="track-title">If I Had A Chicken</span><span class="track-file">Chicken.mp3</span></button>
            </div>

            <div class="media-controls">
                <button class="control-icon-btn" onclick="toggleShuffle()">🔀</button>
                <button class="control-icon-btn" onclick="prevTrack()">⏮</button>
                <button class="control-icon-btn play-pause-circle" id="masterPlay" onclick="toggleMusicPause()">⏸</button>
                <button class="control-icon-btn" onclick="nextTrack()">⏭</button>
                <button class="control-icon-btn" id="repeatIcon" onclick="toggleRepeat()">🔁</button>
            </div>
        </div>
    </div>

    <button id="retryBtn" onclick="resetGame()">RETRY?</button>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
const countdownEl = document.getElementById('countdown-text'), trackList = document.getElementById('track-list');
const bgMusic = new Audio();
let tracks = ['Audio/BikeRides.mp3', 'Audio/TidalWave.mp3', 'Audio/JumperBeat.mp3', 'Audio/Chicken.mp3'], currentTrackIdx = 0;
let isRepeating = false, musicIsPaused = false, isShuffled = false;
let speed = 8, score = 0, gameOver = false, paused = false, inCountdown = false;
let projectiles = [], playerProjectiles = [], player = { x: 0, y: 0, w: 75, h: 75, dy: 0, jumps: 0, rotation: 0 };
let bgScroll = 0, spawnTimer = 0, hasFatalError = false, lermaShake = 0;

// UNPAUSEABLE LOGIC
bgMusic.onpause = () => { if(!musicIsPaused) bgMusic.play().catch(()=>{}); };
bgMusic.onended = () => { if(isRepeating) bgMusic.play(); else nextTrack(); };

function playTrack(src) {
    musicIsPaused = false;
    bgMusic.src = src;
    bgMusic.play();
    document.getElementById('masterPlay').innerText = "⏸";
}

function nextTrack() {
    currentTrackIdx = isShuffled ? Math.floor(Math.random() * tracks.length) : (currentTrackIdx + 1) % tracks.length;
    playTrack(tracks[currentTrackIdx]);
}

function prevTrack() {
    currentTrackIdx = (currentTrackIdx - 1 + tracks.length) % tracks.length;
    playTrack(tracks[currentTrackIdx]);
}

function toggleRepeat() {
    isRepeating = !isRepeating;
    document.getElementById('repeatIcon').style.opacity = isRepeating ? "1" : "0.5";
}

function toggleShuffle() {
    isShuffled = !isShuffled;
    event.target.style.opacity = isShuffled ? "1" : "0.5";
}

function toggleMusicPause() {
    musicIsPaused = !musicIsPaused;
    musicIsPaused ? bgMusic.pause() : bgMusic.play();
    document.getElementById('masterPlay').innerText = musicIsPaused ? "▶" : "⏸";
}

// IMPORT LOGIC: Add file name to Jukebox
document.getElementById('file-input').onchange = (e) => {
    const file = e.target.files[0];
    if(file) {
        const url = URL.createObjectURL(file);
        const fileName = file.name;
        
        // Add to logic array
        tracks.push(url);
        
        // Add to UI Jukebox
        const newBtn = document.createElement('button');
        newBtn.className = 'track-btn';
        newBtn.onclick = () => playTrack(url);
        newBtn.innerHTML = `<span class="track-title">Imported Audio</span><span class="track-file">${fileName}</span>`;
        trackList.appendChild(newBtn);
        
        playTrack(url);
    }
};

const images = {};
const sources = { player: 'Photos/Jamper.png', enemy: 'Photos/Lerma.png', dove: 'Photos/dove.png', bottle: 'Photos/bottle.png', wata: 'Photos/wata.png', bg: 'Photos/Brixk.png' };
for (let key in sources) {
    images[key] = new Image();
    images[key].onerror = () => { hasFatalError = true; document.getElementById('error-screen').style.display = 'flex'; document.getElementById('error-msg').innerText = `Missing: ${sources[key]}`; };
    images[key].src = sources[key];
}

window.addEventListener('keydown', e => {
    if (e.code === 'Escape') togglePause();
    if (gameOver || paused || inCountdown || hasFatalError) return;
    if (['Space','ArrowUp','KeyW'].includes(e.code) && player.jumps < 2) { player.dy = -16; player.jumps++; }
    if (['KeyS','ArrowDown'].includes(e.code)) playerProjectiles.push({ x: player.x, y: player.y + 25, vx: -16 });
});

function togglePause() {
    if (gameOver || hasFatalError || inCountdown) return;
    if (!paused) { paused = true; document.getElementById('pause-overlay').style.display = 'flex'; }
    else { document.getElementById('pause-overlay').style.display = 'none'; startCountdown(); }
}

function startCountdown() {
    paused = true; inCountdown = true; countdownEl.style.display = 'block';
    let count = 3; countdownEl.innerText = count;
    let timer = setInterval(() => {
        count--;
        if (count <= 0) { clearInterval(timer); countdownEl.style.display = 'none'; paused = false; inCountdown = false; update(); }
        else { countdownEl.innerText = count; }
    }, 1000);
}

document.getElementById('startBtn').onclick = () => {
    document.getElementById('loading-screen').style.display = 'none';
    canvas.style.display = 'block';
    playTrack(tracks[currentTrackIdx]);
    resize(); resetGame();
};

window.addEventListener('resize', resize);
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

function resetGame() {
    score = 0; gameOver = false; projectiles = []; playerProjectiles = [];
    player.x = canvas.width - 160; player.y = canvas.height - 180; player.dy = 0;
    document.getElementById('retryBtn').style.display = 'none';
    update();
}

function update() {
    if (gameOver || paused || hasFatalError) return;
    const groundY = canvas.height - 100;
    player.dy += 0.85; player.y += player.dy;
    if (player.y < groundY - player.h) { player.rotation += 0.15; } 
    else { player.y = groundY - player.h; player.dy = 0; player.jumps = 0; player.rotation = Math.round(player.rotation / (Math.PI/2)) * (Math.PI/2); }
    bgScroll -= speed; spawnTimer++;
    if (spawnTimer > 60) { projectiles.push({ x: -50, y: groundY - 55, vx: speed + 4 }); spawnTimer = 0; }
    projectiles.forEach(p => {
        p.x += p.vx;
        if (p.x < player.x + player.w - 20 && p.x + 40 > player.x + 20 && p.y < player.y + player.h && p.y + 40 > player.y) { gameOver = true; document.getElementById('retryBtn').style.display = 'block'; }
    });
    playerProjectiles.forEach((dp, j) => {
        dp.x += dp.vx;
        if (dp.x < 150 && dp.x > 30 && dp.y > groundY - 120) { score += 500; playerProjectiles.splice(j, 1); lermaShake = 15; }
    });
    if (lermaShake > 0) lermaShake--;
    score += 1; draw(); requestAnimationFrame(update);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const bgW = images.bg.width || 100;
    const shiftX = bgScroll % bgW;
    for (let x = shiftX - bgW; x < canvas.width + bgW; x += bgW) ctx.drawImage(images.bg, x, 0, bgW, canvas.height);
    const groundY = canvas.height - 100;
    let lx = 30, ly = groundY - 130;
    if (lermaShake > 0) { lx += (Math.random()-0.5)*15; ly += (Math.random()-0.5)*15; }
    ctx.drawImage(images.enemy, lx, ly, 130, 130);
    ctx.drawImage(images.bottle, lx + 130, groundY - 70, 50, 50);
    playerProjectiles.forEach(dp => ctx.drawImage(images.dove, dp.x, dp.y, 40, 40));
    
    // CYAN SHADOWS FOR WATA
    projectiles.forEach(p => {
        ctx.save(); 
        ctx.shadowBlur = 25; ctx.shadowColor = "cyan"; 
        ctx.drawImage(images.wata, p.x, p.y, 55, 55); 
        ctx.restore();
    });

    ctx.save(); ctx.translate(player.x + player.w/2, player.y + player.h/2); ctx.rotate(player.rotation);
    ctx.drawImage(images.player, -player.w/2, -player.h/2, player.w, player.h); ctx.restore();
    ctx.font = "bold 28px Courier New"; ctx.fillStyle = "#00ff66"; ctx.fillText(`SCORE: ${score}`, 20, 40); 
}
</script>
</body>
</html>
